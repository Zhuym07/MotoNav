name: iOS 0.16.1 reroute recovery build13
on:
  push:
    branches: [codex/ios-0161-reroute-recovery-20261101]
    paths: ['ios/**', '.github/workflows/ios-reroute-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: motonav-ios-reroute-recovery
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run production Swift reroute state and tracking regression
        run: |
          set -o pipefail
          python3 ios/tests/reroute-recovery/run.py | tee reroute-tests.log
          python3 ios/tests/webmotor/check.py | tee core-tests.log
      - uses: actions/cache/restore@v4
        id: pods
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ios-pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
      - name: Reuse verified locked SDK cache
        if: steps.pods.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/LockedSDK" "$HOME/Library/Caches"
          if gh run download 41173836576 -R zyn950929/MotoNav -n ios-locked-pods-cache -D "$RUNNER_TEMP/LockedSDK"; then
            tar -xzf "$RUNNER_TEMP/LockedSDK/ios-locked-pods-cache.tar.gz" -C "$HOME/Library/Caches"
          fi
      - name: Install locked iOS SDKs
        working-directory: ios
        run: |
          sudo gem install cocoapods -v 1.16.2 --no-document
          pod _1.16.2_ install --deployment
      - name: Build iPhone Release arm64
        run: |
          set -o pipefail
          xcodebuild -workspace ios/MotoNav.xcworkspace -scheme MotoNav -destination 'generic/platform=iOS' -configuration Release -derivedDataPath "$RUNNER_TEMP/Derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= build | tee build-ios.log
      - name: Package experimental IPA and matching source
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Derived/Build/Products/Release-iphoneos/MotoNav.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = '0.16.1'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = '13'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/PlugIns/MotoNavShare.appex/Info.plist")" = '0.16.1'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/PlugIns/MotoNavShare.appex/Info.plist")" = '13'
          mkdir -p output/ios "$RUNNER_TEMP/Stage/Payload"
          ditto "$APP" "$RUNNER_TEMP/Stage/Payload/MotoNav.app"
          xcrun strip -S "$RUNNER_TEMP/Stage/Payload/MotoNav.app/MotoNav"
          xcrun strip -S "$RUNNER_TEMP/Stage/Payload/MotoNav.app/PlugIns/MotoNavShare.appex/MotoNavShare"
          (cd "$RUNNER_TEMP/Stage" && zip -qry "$GITHUB_WORKSPACE/output/ios/MotoNav-0.16.1-reroute-recovery-build13-unsigned.ipa" Payload)
          git archive --format=zip -o output/ios/MotoNav-iOS-0.16.1-build13-Source.zip HEAD ios .github/workflows/ios-reroute-recovery.yml
          (cd output/ios && shasum -a 256 *.ipa *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MotoNav-iOS-0.16.1-RerouteRecovery-Build13
          path: |
            output/ios/
            reroute-tests.log
            core-tests.log
            build-ios.log
          if-no-files-found: warn
